<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>ITB-gate simulator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <div class="toll">

            <div class="gate" id="gate">
                <div class="hold">
                </div>
                <div class="pole" id="pole"></div>
            </div>
            <div class="toll-read">
                <p>Welcome <br />
                    <span id="msg">Tap your card</span>
                </p>
                <div id="target">
                    <span>Drop here</span>
                </div>
            </div>

        </div>
        <div class="cards" id="cards">

        </div>
    </div>

    <!-- Simulation settings panel -->
    <details class="sim-panel" open>
        <summary>Simulation Settings</summary>

        <div class="sim-row">
            <span class="sim-label">Gate</span>
            <div class="sim-switch">
                <label><input type="radio" name="mode" value="entry" checked> Entry</label>
                <label><input type="radio" name="mode" value="exit"> Exit</label>
            </div>
        </div>

        <div class="sim-row">
            <span class="sim-label">Time</span>
            <input type="datetime-local" id="simTime">
        </div>

        <div class="sim-row sim-buttons">
            <button type="button" data-add="15">+15 min</button>
            <button type="button" data-add="60">+1 hour</button>
            <button type="button" data-add="1440">+1 day</button>
            <button type="button" id="nowBtn">Now</button>
        </div>

        <div class="sim-title">Cards</div>
        <div id="cardConfig"></div>
    </details>

    <script>

        // Default card data (used the first time, or after localStorage is cleared)
        const defaultCards = [
            { name: 'Budi', id: '1e2f3g2dwa', vehicle: 'motor', balance: 100000, status: 'outside' },
            { name: 'Sari', id: '8k4m2p9xqa', vehicle: 'mobil', balance: 100000, status: 'outside' },
            { name: 'Andi', id: '7v3n5j1wbc', vehicle: 'motor', balance: 50000, status: 'outside' }
        ];

        // Card data survives refresh via localStorage
        const cardholder = JSON.parse(localStorage.getItem("cardholder") || "null") || defaultCards;

        function persist() {
            localStorage.setItem("cardholder", JSON.stringify(cardholder));
        }

        const target = document.getElementById("target");
        const pole = document.getElementById("pole");
        const msg = document.getElementById("msg");
        const simTime = document.getElementById("simTime");

        let mode = "entry";
        let busy = false;

        async function post(url, body) {
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            return res.json();
        }

        function toInput(d) {
            return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        }

        simTime.value = toInput(new Date());

        document.getElementById("nowBtn").onclick = () => {
            simTime.value = toInput(new Date());
        };

        document.querySelectorAll("[data-add]").forEach(btn => {
            btn.onclick = () => {
                const d = new Date(simTime.value);
                d.setMinutes(d.getMinutes() + Number(btn.dataset.add));
                simTime.value = toInput(d);
            };
        });

        document.querySelectorAll('input[name="mode"]').forEach(r => {
            r.onchange = () => mode = r.value;
        });

        function showCards() {
            const item = cardholder.map(crd => `  <div class="drag-el" id="${crd.id}">
                <span class="owner">${crd.name}</span>
                <span class="location">Condet Cove</span>
            </div>`).join('');

            document.getElementById("cards").innerHTML = item;
            setupDrag();
        }

        function showConfig() {
            document.getElementById("cardConfig").innerHTML = cardholder.map(c => `
                <div class="cfg-card" data-id="${c.id}">
                    <input class="cfg-name" value="${c.name}">
                    <select class="cfg-vehicle">
                        <option value="motor" ${c.vehicle === "motor" ? "selected" : ""}>motor</option>
                        <option value="mobil" ${c.vehicle === "mobil" ? "selected" : ""}>mobil</option>
                    </select>
                    <input class="cfg-balance" type="number" min="0" step="1000" value="${c.balance}">
                    <button type="button" class="cfg-save">Save</button>
                    <div class="cfg-status">${c.status === "inside" ? "Inside" : "Outside"}</div>
                </div>`).join("");

            document.querySelectorAll(".cfg-save").forEach(btn => {
                btn.onclick = () => {
                    const row = btn.closest(".cfg-card");
                    const c = cardholder.find(x => x.id === row.dataset.id);
                    c.name = row.querySelector(".cfg-name").value;
                    c.vehicle = row.querySelector(".cfg-vehicle").value;
                    c.balance = Number(row.querySelector(".cfg-balance").value);
                    persist();
                    showCards();
                    showConfig();
                };
            });
        }

        async function tap(id) {
            if (busy) return;
            busy = true;

            const c = cardholder.find(x => x.id === id);

            // Card data is sent directly with each request (no sync / registration)
            const res = await post("/api/" + mode, {
                card_id: c.id,
                owner: c.name,
                vehicle: c.vehicle,
                balance: c.balance,
                time: simTime.value
            });

            if (res.success) {
                if (mode === "entry") {
                    c.status = "inside";
                } else {
                    c.status = "outside";
                    c.balance = res.balance_after;
                }
                persist();

                target.classList.add("hit");
                pole.classList.add("active");
                msg.textContent = mode === "exit" ? "Fee: Rp " + res.fee : res.message;

                setTimeout(() => {
                    pole.classList.remove("active");
                    target.classList.remove("hit");
                    msg.textContent = "Tap your card";
                    busy = false;
                }, 3000);
            } else {
                target.classList.add("deny");
                msg.textContent = res.message;

                setTimeout(() => {
                    target.classList.remove("deny");
                    msg.textContent = "Tap your card";
                    busy = false;
                }, 2000);
            }

            showConfig();
        }

        function setupDrag() {
            const cards = document.querySelectorAll(".drag-el");

            cards.forEach(card => {
                let startX, startY;
                let dragging = false;

                card.addEventListener("pointerdown", (e) => {
                    dragging = true;

                    startX = e.clientX;
                    startY = e.clientY;

                    card.setPointerCapture(e.pointerId);
                    card.classList.add("drag");
                });

                card.addEventListener("pointermove", (e) => {
                    if (!dragging) return;

                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;

                    card.style.transform = `translate(${dx}px, ${dy}px)`;
                });

                function mouseoff() {
                    if (!dragging) return;

                    dragging = false;
                    card.classList.remove("drag");

                    if (targethit(card)) tap(card.id);
                    card.style.transform = "";
                }

                card.addEventListener("pointerup", mouseoff);
                card.addEventListener("pointercancel", mouseoff);
            });
        }

        function targethit(card) {
            const cardRect = card.getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();

            return (
                cardRect.left < targetRect.right &&
                cardRect.right > targetRect.left &&
                cardRect.top < targetRect.bottom &&
                cardRect.bottom > targetRect.top
            );
        }

        // On load: sync "inside/outside" status with the server's active sessions
        async function init() {
            try {
                const res = await fetch("/api/sessions").then(r => r.json());
                cardholder.forEach(c => {
                    c.status = res.sessions.includes(c.id) ? "inside" : "outside";
                });
                persist();
            } catch (e) {
                // server unreachable: fall back to localStorage data
            }
            showCards();
            showConfig();
        }

        init();
    </script>
</body>

</html>
